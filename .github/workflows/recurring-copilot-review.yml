name: Recurring Copilot review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  copilot-requests: write

concurrency:
  group: recurring-copilot-review-${{ github.event.pull_request.node_id || inputs.pull_request }}
  cancel-in-progress: true

jobs:
  review:
    name: Recurring Copilot review
    if: github.event_name != 'pull_request_target' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install pinned Copilot CLI without repository token
        run: npm install --global @github/copilot@1.0.84 --no-audit --no-fund
      - name: Capture pull request diff without executing PR code
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/recurring-copilot-review
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only > .artifacts/recurring-copilot-review/changed-files.txt
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > .artifacts/recurring-copilot-review/diff.patch
          test -s .artifacts/recurring-copilot-review/changed-files.txt
          test -s .artifacts/recurring-copilot-review/diff.patch
      - name: Run scoped read-only Copilot review
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          copilot \
            -C "$GITHUB_WORKSPACE" \
            --yolo \
            --no-ask-user \
            --disable-builtin-mcps \
            --no-remote-export \
            --no-color \
            --max-ai-credits 30 \
            -p "Review the whole pull request diff in .artifacts/recurring-copilot-review/diff.patch and changed files in .artifacts/recurring-copilot-review/changed-files.txt. Publish concise review output with scoped guards. Do not modify files, create commits, push, open issues, or publish releases." \
            > .artifacts/recurring-copilot-review/review.md
          test -s .artifacts/recurring-copilot-review/review.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: recurring-copilot-review
          path: .artifacts/recurring-copilot-review/
          retention-days: 14
          if-no-files-found: error
