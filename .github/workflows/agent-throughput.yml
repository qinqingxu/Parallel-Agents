name: Agent throughput report

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-throughput
  cancel-in-progress: false

jobs:
  report:
    name: Measure merged PR throughput
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Generate the bounded 90-day report
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/agent-throughput.mjs --repository "$GITHUB_REPOSITORY"
      - name: Retain the aggregate report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-throughput
          path: reports/agent-throughput/
          retention-days: 30
          if-no-files-found: error
