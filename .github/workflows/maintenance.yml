name: Validated maintenance proposal

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  workflow_run:
    workflows: ['Validate']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: non-runtime-maintenance
  cancel-in-progress: false

jobs:
  propose:
    name: Prepare a reviewed-formatting candidate
    if: >-
      (github.event_name != 'workflow_run' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out only the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked validation dependencies
        run: npm ci
      - name: Make at most one bounded non-runtime repair and validate it
        run: npm run maintenance:apply -- --output reports/maintenance/proposal.json --patch reports/maintenance/proposal.patch
      - name: Retain proposal and honest validation or rollback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maintenance-proposal
          path: reports/maintenance/
          retention-days: 14
          if-no-files-found: warn
