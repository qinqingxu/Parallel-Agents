name: Documentation contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Fail on stale documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Check all active Markdown without dependency installation
        run: npm run check:docs
      - name: Verify checked-diff documentation contract update path
        run: npm run docs:contracts:write && git diff --exit-code -- docs/documentation-contracts.md
      - name: Verify failure and scope contracts of the checker
        run: node --test tests/check-docs.test.mjs
